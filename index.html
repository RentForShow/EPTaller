<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1E1E24">
<title>EPTaller</title>
<meta name="apple-mobile-web-app-title" content="EPTaller">
<meta name="application-name" content="EPTaller">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--carbon:#1E1E24;--carbon2:#33333D;--yellow:#FFD21F;--yellowL:#FFF1B0;--blue:#2A5CFF;--blueL:#E1E8FF;--orange:#FF9A3C;--cream:#FBF7EC;--grey:#5E5E6B;--line:#DEDEE3;--pale:#F4F4F6;--red:#B00020}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#15151a;background:#fff}
button,input,select,textarea{font:inherit}
header.top{background:var(--carbon);color:#fff;position:sticky;top:0;z-index:20;border-bottom:4px solid var(--yellow)}
.brand{padding:10px 16px 4px;font-weight:bold;font-size:18px;letter-spacing:.3px}
.brand span{color:var(--yellow);font-weight:normal;font-size:13px;margin-left:6px}
nav{display:flex;gap:2px;overflow-x:auto;padding:0 8px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:#cfd0d8;padding:10px 14px;font-size:14px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
nav button.on{color:#fff;font-weight:bold;border-bottom-color:var(--blue)}
main{max-width:1240px;margin:0 auto;padding:16px}
h2{margin:6px 0 2px;font-size:22px;color:var(--carbon)}
h3{margin:0 0 10px;font-size:15px;color:var(--carbon)}
.sub{color:var(--grey);margin:0 0 14px;font-size:13px;line-height:1.4}
.banner{background:var(--yellowL);border-left:5px solid var(--yellow);padding:9px 14px;margin:0;font-size:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.card{border:1px solid var(--line);border-top:4px solid var(--blue);background:#fff;padding:14px;margin-bottom:14px}
.card.dark{border-top-color:var(--carbon)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--pale);border-top:4px solid var(--blue);padding:10px 14px}
.kpi.y{border-top-color:var(--yellow)}
.kpi small{display:block;color:var(--grey);font-weight:bold;font-size:11px;letter-spacing:.3px;text-transform:uppercase}
.kpi b{display:block;font-size:24px;color:var(--carbon);margin:4px 0}
.kpi em{font-size:12px;color:var(--grey);display:block;overflow-wrap:anywhere}.kpi .chip{white-space:normal}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
@media(max-width:480px){.kpi b{font-size:20px}.kpi{padding:8px 10px}.kpi small{font-size:10px}main{padding:10px}}
label{display:block;font-size:12px;color:var(--grey);font-weight:bold}
label>input,label>select,label>textarea{display:block;width:100%;margin-top:4px;font-weight:normal}
input,select,textarea{border:1px solid #c9c9d1;border-radius:4px;padding:8px;background:var(--cream);color:#0000c8;min-height:38px}
select{color:#0000c8}
textarea{width:100%;min-height:300px;font-family:Arial;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:0}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.fg .w2{grid-column:span 2}.fg .wall{grid-column:1/-1}
@media(max-width:480px){.fg .w2{grid-column:1/-1}}
.btn{background:var(--carbon);color:#fff;border:0;padding:10px 16px;border-radius:4px;cursor:pointer;font-weight:bold}
.btn.blue{background:var(--blue)}.btn.ghost{background:#fff;color:var(--carbon);border:1px solid var(--carbon)}
.btn.warn{background:#fff;color:var(--red);border:1px solid var(--red)}
.btn.big{padding:14px 22px;font-size:16px;width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ico{background:none;border:1px solid var(--line);border-radius:4px;cursor:pointer;padding:6px 9px;color:var(--grey)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .sp{flex:1}
.tw{overflow-x:auto;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--carbon);color:#fff;padding:8px 8px;text-align:center;font-size:12px;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
td.l,th.l{text-align:left}td.l{white-space:normal}td.r{text-align:right}
tr.band td{background:var(--blue);color:#fff;font-weight:bold;text-align:left;padding:6px 10px}
tr.tot td{background:var(--blueL);font-weight:bold;color:var(--carbon);border-top:2px solid var(--blue)}
tr.pack td:first-child{padding-left:22px;font-style:italic}
tr.cancel td{color:#8a8a95;text-decoration:line-through}
tr:hover td{background:#fafaff}tr.band:hover td{background:var(--blue)}tr.tot:hover td{background:var(--blueL)}
.chip{display:inline-block;padding:2px 8px;border-radius:3px;font-weight:bold;font-size:11px;white-space:nowrap}
.chip.ok{background:var(--blueL);color:var(--carbon)}
.chip.low{background:var(--yellowL);color:#7A4A00}
.chip.out{background:var(--orange);color:#000}
.chip.neu{background:#ececf0;color:var(--grey)}
.chip.info{background:var(--blue);color:#fff}
.neg{color:var(--red);font-weight:bold}
.cdot{display:inline-block;width:18px;height:18px;border-radius:50%;border:2px solid #8a8a96;vertical-align:-4px;flex:none;text-align:center;font-size:11px;font-style:normal;line-height:14px}
.cdot.big{width:28px;height:28px;vertical-align:middle}
.cdot.none{background:transparent}
@media(max-width:480px){.tbtn{padding:6px 9px;font-size:12px}}
.brand .logo{display:flex;align-items:center;gap:10px}.brand img{height:34px;width:auto;display:block}
.ver{font-style:normal;font-size:12px;font-weight:bold;color:#1E1E24;background:#FFD21F;border-radius:3px;padding:1px 6px;margin-left:4px;vertical-align:2px}
.cband{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;min-height:42px;border:1px solid rgba(0,0,0,.35)}
.cband b{background:rgba(255,255,255,.93);color:#111;padding:2px 7px;border-radius:3px}
.cband span{background:rgba(0,0,0,.78);color:#fff;font-size:11px;font-weight:bold;padding:2px 7px;border-radius:3px;white-space:nowrap}
.cpl{border:1px solid var(--line);padding:10px;margin-bottom:10px;background:var(--pale)}
.cpl .fg{margin-top:8px}
.lbl{display:block;font-weight:bold;font-size:13px;margin-bottom:6px}
.tg{display:inline-block;padding:1px 8px;border:1px solid var(--carbon);border-radius:10px;font-size:11px;font-weight:bold;margin-right:2px}
.tgb{border:1px solid var(--grey);background:#fff;color:var(--carbon);border-radius:14px;padding:6px 12px;font-size:13px;margin:0 4px 6px 0;cursor:pointer}
.tgb.on{background:var(--carbon);color:#fff;border-color:var(--carbon);font-weight:bold}
html[data-theme=dark] .tg{border-color:#8FA8FF;color:#DCE5FF}
html[data-theme=dark] .tgb{background:#1c1c24;color:#ddd;border-color:#4a4a58}
html[data-theme=dark] .tgb.on{background:#2A5CFF;color:#fff;border-color:#6C8BFF}
.meter{display:inline-block;width:64px;height:8px;background:#e6e6ec;vertical-align:middle;margin-right:6px;border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue)}
.meter.low i{background:var(--yellow)}.meter.out i{background:var(--orange)}
.hbar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.hbar .n{width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .b{flex:1;background:#ececf0;height:14px;border-radius:2px}
.hbar .b i{display:block;height:100%;background:var(--blue);border-radius:2px}
.hbar.y .b i{background:var(--yellow)}
.hbar .v{width:84px;text-align:right;font-weight:bold}
.note{background:var(--yellowL);border-left:4px solid var(--yellow);padding:8px 12px;font-size:12.5px;line-height:1.45;margin:10px 0}
.hint{font-size:12px;color:var(--grey);margin-top:4px}
.sw{display:inline-block;width:12px;height:12px;border:1px solid #888;vertical-align:-2px;margin-right:5px}
.edrow{display:grid;grid-template-columns:1fr 120px 34px;gap:8px;align-items:end;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.edrow.pr{grid-template-columns:1fr 110px 100px 100px 34px}
.edc span{display:block;font-size:11px;color:var(--grey);font-weight:bold}
.edc b{display:block;padding:9px 0}
.edsel select{width:100%}
@media(max-width:700px){.edrow,.edrow.pr{grid-template-columns:1fr 1fr 34px}.edrow .edsel{grid-column:1/-1}.edrow.pr{grid-template-columns:1fr 1fr 1fr 34px}.edrow.pr .edsel{grid-column:1/-1}}
.ov{position:fixed;inset:0;background:rgba(20,20,30,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 10px}
.mod{background:#fff;width:100%;max-width:820px;border-top:5px solid var(--yellow)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--carbon);color:#fff}
.mh .x{background:none;border:0;color:#fff;font-size:18px;cursor:pointer}
.mb{padding:16px}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.mf .sp{flex:1}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--carbon);color:#fff;padding:10px 18px;border-left:5px solid var(--yellow);z-index:60;display:none;max-width:92vw;font-size:13px}
.sumrow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);gap:10px}
.sumrow b{text-align:right}
.hist{border-bottom:1px solid var(--line);padding:10px 0;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.hist .m{flex:1;min-width:220px}
.pill{display:inline-block;background:var(--pale);border:1px solid var(--line);border-radius:3px;padding:1px 7px;margin:2px 4px 2px 0;font-size:12px}
.legend{font-size:12px;color:var(--grey);margin-top:8px}

.brand{display:flex;justify-content:space-between;align-items:center}
.tbtn{background:transparent;color:#fff;border:1px solid #6b6b7a;border-radius:14px;padding:4px 12px;font-size:12px;cursor:pointer}
#bnav{display:none}
.lcard{border:1px solid var(--line);border-left:5px solid var(--blue);background:var(--pale);padding:10px 12px;margin-bottom:8px}
.lcard.fcard{padding:0;border-left-width:1px}
.fcard .fhead{min-height:62px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:8px 12px}
.fcard .fn{font-size:16px;padding:3px 8px;background:rgba(255,255,255,.93);color:#111;border-radius:3px}
.fcard .fc{font-size:12px;font-weight:bold;padding:3px 8px;background:rgba(0,0,0,.78);color:#fff;border-radius:3px;white-space:nowrap}
.fcard .fbody{padding:10px 12px 12px}
.lcard.tot{border-left-color:var(--yellow)}
.lcard.pk{margin-left:14px;border-left-color:var(--grey)}
.lcard.cancel b,.lcard.cancel .kv{text-decoration:line-through;opacity:.7}
.lcard.menu{display:block;width:100%;text-align:left;color:inherit;cursor:pointer;font-size:15px;padding:14px}
.lcard.menu b{display:block;margin-bottom:2px}
.lr{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kv{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin:6px 0}
.mband{background:var(--blue);color:#fff;font-weight:bold;padding:6px 10px;margin:12px 0 8px}
@media(max-width:700px){
 nav#nav{display:none}
 #bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--carbon);border-top:3px solid var(--yellow);z-index:30}
 #bnav button{flex:1;background:none;border:0;color:#cfd0d8;padding:7px 2px 9px;font-size:11px;display:flex;flex-direction:column;gap:1px;align-items:center;cursor:pointer}
 #bnav button span{font-size:18px;line-height:1.2}
 #bnav button.on{color:#fff;font-weight:bold;box-shadow:inset 0 3px 0 var(--blue)}
 body{padding-bottom:70px}
 .brand{padding:8px 14px}
 .banner{font-size:12px;padding:6px 10px;gap:8px}.banner .btn{padding:6px 10px;font-size:12px}
 h2{font-size:20px}
 .mf .btn{flex:1}
}
html[data-theme=dark]{color-scheme:dark;--carbon:#0B0B0F;--carbon2:#1B1B22;--yellowL:#3B3306;--blueL:#223062;--cream:#262630;--grey:#A8A8B8;--line:#363642;--pale:#1B1B22;--red:#FF8A98}
html[data-theme=dark] body{background:#121216;color:#ECECF1}
html[data-theme=dark] h2,html[data-theme=dark] h3,html[data-theme=dark] .kpi b,html[data-theme=dark] .hist b{color:#fff}
html[data-theme=dark] a{color:#8FA8FF}
html[data-theme=dark] .card,html[data-theme=dark] .mod{background:#17171d}
html[data-theme=dark] .mh{background:#0B0B0F}
html[data-theme=dark] input,html[data-theme=dark] select,html[data-theme=dark] textarea{color:#AFC0FF;border-color:#4a4a58}
html[data-theme=dark] input::placeholder{color:#8a8a99}
html[data-theme=dark] .btn{background:#2A2A35}
html[data-theme=dark] .btn.blue{background:#2A5CFF}
html[data-theme=dark] .btn.ghost{background:transparent;color:#ECECF1;border-color:#9b9bab}
html[data-theme=dark] .btn.warn{background:transparent;color:var(--red);border-color:var(--red)}
html[data-theme=dark] .ico{background:transparent;color:#D0D0DC;border-color:#4a4a58}
html[data-theme=dark] .chip.ok{background:#223062;color:#DCE5FF}
html[data-theme=dark] .chip.low{background:#4A3D0A;color:#FFE27A}
html[data-theme=dark] .chip.neu{background:#2E2E38;color:#C4C4D2}
html[data-theme=dark] tr.tot td{background:#1C2650;color:#fff;border-top-color:#6C8BFF}
html[data-theme=dark] tr:hover td{background:#1F1F28}
html[data-theme=dark] tr.band:hover td{background:var(--blue)}
html[data-theme=dark] .hbar .b,html[data-theme=dark] .meter{background:#2E2E38}
html[data-theme=dark] .hbar .b i,html[data-theme=dark] .meter i{background:#6C8BFF}
html[data-theme=dark] .hbar.y .b i{background:var(--yellow)}
html[data-theme=dark] .meter.low i{background:var(--yellow)}
html[data-theme=dark] .meter.out i{background:var(--orange)}
html[data-theme=dark] .note,html[data-theme=dark] .banner{color:#F3E6A6}
html[data-theme=dark] .kpi{border-top-color:#6C8BFF}
html[data-theme=dark] .kpi.y{border-top-color:var(--yellow)}
html[data-theme=dark] .card{border-top-color:#6C8BFF}
html[data-theme=dark] .card.dark{border-top-color:#8a8a99}
html[data-theme=dark] .lcard{border-left-color:#6C8BFF}
html[data-theme=dark] .lcard.tot{border-left-color:var(--yellow)}
html[data-theme=dark] #toast{border:1px solid var(--line);border-left:5px solid var(--yellow)}
html[data-theme=dark] .ov{background:rgba(0,0,0,.7)}
html[data-theme=dark] .sw{border-color:#bbb}
html[data-theme=dark] tr.cancel td{color:#8a8a99}
</style>
</head>

  const f=p.ficha;if(!f||!num(f.piezas))return null;

function edInit(id,rows,mode,onChange){ED[id]={rows,mode,onChange}}

function edInner(id){

function edAdd(id){ED[id].rows.push({fid:'',g:'',hint:'',sw:''});edRender(id)}
function edDel(id,i){const r=ED[id].rows;r.splice(i,1);if(!r.length&&ED[id].mode==='print')r.push({fid:'',g:'',hint:'',sw:''});edRender(id)}
function edSel(id,i,v){ED[id].rows[i].fid=v;edRender(id)}
function edG(id,i,v){const e=ED[id];e.rows[i].g=v;edCells(id);if(e.onChange)e.onChange()}
function edCells(id){
  const e=ED[id];if(!e||e.mode!=='print')return;
  const T=Math.max(0,num(PD.tandas)),agg={};
  e.rows.forEach(r=>{if(r.fid)agg[r.fid]=(agg[r.fid]||0)+num(r.g)*T});
  e.rows.forEach((r,i)=>{
    const t=$('#ed_'+id+'_t'+i),q=$('#ed_'+id+'_r'+i);if(!t||!q)return;
    t.textContent=n1(num(r.g)*T)+' g';
    const f=fil(r.fid);

  });
}

const impName=i=>{const p=prod(i.productoId);return p?p.nombre:(i.etiqueta||'Sin producto')};

/* ---------- IMPRIMIR ---------- */
function newDraft(){return{productoId:'',etiqueta:'',tandas:1,piezas:1,fallos:0,horas:'',fecha:today(),nota:'',rows:[{fid:'',g:'',hint:'',sw:''}]}}
let PD=newDraft();
function vImprimir(){
  edInit('pd',PD.rows,'print',pdUpd);

  return`<h2>Imprimir</h2><p class="sub">Apunta lo que vas a imprimir en la Bambu Lab y los gramos de cada filamento: al registrarlo se restan del stock. Puedes escribirlo a mano o leerlo del archivo laminado de Bambu Studio.</p>

      ${PD.productoId?'':`<label class="w2">Etiqueta (opcional)<input value="${esc(PD.etiqueta)}" oninput="PD.etiqueta=this.value" placeholder="Ej. prueba de calibración"></label>`}
      <label>Fecha<input type="date" value="${esc(PD.fecha)}" oninput="PD.fecha=this.value"></label>
      <label>Tandas (placas)<input type="number" min="0" step="1" inputmode="numeric" value="${esc(PD.tandas)}" oninput="PD.tandas=this.value;pdUpd()"></label>
      <label>Piezas por tanda<input type="number" min="0" step="1" inputmode="numeric" value="${esc(PD.piezas)}" oninput="PD.piezas=this.value;pdUpd()"></label>
      <label>Fallos (piezas)<input type="number" min="0" step="1" inputmode="numeric" value="${esc(PD.fallos)}" oninput="PD.fallos=this.value;pdUpd()"></label>
      <label>Horas por tanda<input type="number" min="0" step="any" inputmode="decimal" value="${esc(PD.horas)}" oninput="PD.horas=this.value;pdUpd()"></label>
      <label class="wall">Nota<input value="${esc(PD.nota)}" oninput="PD.nota=this.value" placeholder="Opcional"></label>
     </div>
     ${PD.productoId?'<p class="hint">Se ha cargado la receta de la ficha del producto (filamentos y piezas por tanda). Puedes cambiarla para esta impresión.</p>':''}
    </section>
    <section class="card"><h3>2 · Filamentos y gramos</h3>
     <div class="bar"><button class="btn ghost" onclick="$('#f3mf').click()">📂 Leer archivo de Bambu Studio (.3mf)</button></div>
     <p class="hint" style="margin-top:-4px">Exporta en Bambu Studio "Export plate sliced file" (.gcode.3mf). Lee los gramos de cada ranura; tú eliges a qué rollo del stock corresponde cada una. Si no tienes el archivo, escribe los gramos a mano.</p>
     ${edHtml('pd')}
     <p class="hint">Los gramos son <b>por tanda</b>. Se restan multiplicados por el número de tandas.</p>
    </section>
   </div>
   <div>
    <section class="card dark" style="position:sticky;top:112px"><h3>3 · Resumen</h3><div id="psum"></div>
     <button class="btn blue big" style="margin-top:12px" onclick="pdRegister()">Registrar impresión y restar filamento</button>
    </section>
   </div>
  </div>
  <section class="card"><h3>Historial de impresiones</h3>
   ${hist.map(i=>`<div class="hist"><div class="m"><b>${fdate(i.fecha)} · ${esc(impName(i))}</b><div class="hint">${n0(i.tandas)} tanda(s) · ${n0(i.buenas)} pieza(s) buena(s)${num(i.fallos)?' · '+n0(i.fallos)+' fallo(s)':''}${i.horas?' · '+n1(i.horas)+' h':''}${i.nota?' · '+esc(i.nota):''}</div><div>${i.consumo.map(c=>{const f=fil(c.fid);return`<span class="pill">${esc(f?f.color:'(filamento borrado)')}: ${n1(c.g)} g</span>`}).join('')}</div></div><div><button class="ico" onclick="pdUndo('${i.id}')">↩ Deshacer</button></div></div>`).join('')||'<p class="hint">Aún no hay impresiones registradas.</p>'}

function pdProd(id){
  PD.productoId=id;const p=prod(id);
  if(p){
    const f=p.ficha||{};PD.piezas=num(f.piezas)||1;
    PD.rows=(f.fils||[]).map(x=>({fid:x.fid,g:num(x.g)>0?x.g:'',hint:'',sw:''}));
    if(!PD.rows.length)PD.rows=[{fid:'',g:'',hint:'',sw:''}];
    if(num(f.horas))PD.horas=f.horas;
  }
  render();
}
function pdTotals(){
  const T=Math.max(0,num(PD.tandas)),rows=PD.rows.filter(r=>r.fid&&num(r.g)>0);
  const agg={};let g=0,cost=0;
  rows.forEach(r=>{const x=num(r.g)*T;agg[r.fid]=(agg[r.fid]||0)+x;g+=x;cost+=x*pG(fil(r.fid))});
  return{T,rows,agg,g,cost,buenas:Math.max(0,T*num(PD.piezas)-num(PD.fallos))};
}
function pdUpd(){
  const el=$('#psum');if(!el)return;
  const t=pdTotals();edCells('pd');
  const lines=Object.entries(t.agg).map(([id,g])=>{
    const f=fil(id),after=num(f.gramos)-g;
    let ch=after<0?chip('out','SIN STOCK SUFICIENTE'):(num(f.minimo)>0&&after<=num(f.minimo)*1000)?chip('low','QUEDARÁ BAJO'):'';
    return`<div class="sumrow"><span>${esc(f.color)}</span><b>${n0(f.gramos)} → <span class="${after<0?'neg':''}">${n0(after)} g</span> ${ch}</b></div>`;
  }).join('');
  el.innerHTML=`<div class="sumrow"><span>Piezas buenas</span><b>${n0(num(PD.tandas))} × ${n0(num(PD.piezas))} − ${n0(num(PD.fallos))} = ${n0(t.buenas)}</b></div>
   <div class="sumrow"><span>Filamento total a restar</span><b>${n1(t.g)} g</b></div>
   <div class="sumrow"><span>Coste del plástico (sin merma)</span><b>${eur(t.cost)}</b></div>
   <div class="sumrow"><span>Plástico por pieza buena</span><b>${t.buenas?eur(t.cost/t.buenas):'–'}</b></div>
   ${PD.horas?`<div class="sumrow"><span>Tiempo total</span><b>${n1(num(PD.horas)*t.T)} h</b></div>`:''}
   <h3 style="margin:12px 0 4px">Stock de filamento</h3>${lines||'<p class="hint">Elige filamentos y gramos.</p>'}`;
}
function pdRegister(){
  const t=pdTotals();
  if(!t.rows.length||t.T<=0){toast('Elige al menos un filamento, sus gramos y las tandas.');return}
  const short=Object.entries(t.agg).filter(([id,g])=>g>num(fil(id).gramos));
  const go_=()=>{
    Object.entries(t.agg).forEach(([id,g])=>{const f=fil(id);f.gramos=Math.round((num(f.gramos)-g)*10)/10});
    t.rows.forEach(r=>{if(r.key)S.meta.slotMap[r.key]=r.fid});
    S.impresiones.push({id:uid('i'),fecha:PD.fecha||today(),productoId:PD.productoId||null,etiqueta:PD.etiqueta||'',tandas:t.T,piezas:num(PD.piezas),fallos:num(PD.fallos),buenas:t.buenas,horas:num(PD.horas)?num(PD.horas)*t.T:0,nota:PD.nota,costePlastico:t.cost,consumo:Object.entries(t.agg).map(([fid,g])=>({fid,g:Math.round(g*10)/10}))});
    save();const fecha=PD.fecha;PD=newDraft();PD.fecha=fecha;toast('✔ Impresión registrada y filamento restado');render();
  };
  if(short.length)ask('Stock insuficiente',`<p>No hay gramos suficientes de:</p><ul>${short.map(([id,g])=>`<li>${esc(fil(id).color)}: hay ${n0(fil(id).gramos)} g y se restan ${n0(g)} g</li>`).join('')}</ul><p>Si continúas, el stock quedará en negativo. Revisa el recuento del rollo.</p>`,go_,'Registrar igualmente');
  else go_();
}
function pdUndo(id){

/* lectura de .3mf de Bambu Studio (zip sin librerías) */
function zipEntries(buf){
  const dv=new DataView(buf);let e=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65557);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}
  if(e<0)throw new Error('El archivo no es un .3mf válido');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out={};
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lho=dv.getUint32(p+42,true);
    out[new TextDecoder().decode(new Uint8Array(buf,p+46,nl))]={method,csize,lho};p+=46+nl+el+cl;
  }
  return out;
}
async function zipRead(buf,en){
  const dv=new DataView(buf),start=en.lho+30+dv.getUint16(en.lho+26,true)+dv.getUint16(en.lho+28,true),data=new Uint8Array(buf,start,en.csize);
  if(en.method===0)return data;
  if(en.method!==8)throw new Error('Compresión del .3mf no soportada');
  const s=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function parse3mf(buf){
  const ents=zipEntries(buf),name=Object.keys(ents).find(n=>/slice_info\.config$/i.test(n));
  if(!name)throw new Error('Este .3mf no trae datos de laminado. Exporta "Plate sliced file" (.gcode.3mf) desde Bambu Studio.');
  const xml=new TextDecoder().decode(await zipRead(buf,ents[name]));
  const doc=new DOMParser().parseFromString(xml,'application/xml');
  const plate=doc.querySelector('plate');if(!plate)throw new Error('No encuentro la placa en el archivo.');
  const meta={};plate.querySelectorAll('metadata').forEach(m=>{meta[m.getAttribute('key')]=m.getAttribute('value')});
  const slots=[...plate.querySelectorAll('filament')].map(f=>({id:f.getAttribute('id'),type:f.getAttribute('type')||'',color:(f.getAttribute('color')||'').toUpperCase(),g:num(f.getAttribute('used_g'))})).filter(s=>s.g>0);
  if(!slots.length)throw new Error('El archivo no indica gramos usados. Vuelve a laminar y exporta el archivo de la placa.');
  return{slots,total:slots.reduce((a,s)=>a+s.g,0),hours:num(meta.prediction)/3600};
}
async function pdImport(file){
  if(!file)return;
  try{
    const info=await parse3mf(await file.arrayBuffer());
    PD.rows=info.slots.map(s=>{const key=s.type+'|'+s.color,fid=S.meta.slotMap[key];return{fid:fil(fid)?fid:'',g:Math.round(s.g*100)/100,hint:`Ranura ${s.id} · ${s.type||'?'} · ≈ ${hexName(s.color)} (${s.color})`,sw:s.color,key}});
    PD.tandas=1;if(info.hours)PD.horas=Math.round(info.hours*100)/100;
    if(!PD.nota)PD.nota='Archivo: '+file.name;
    toast(`Leído: ${info.slots.length} filamento(s), ${n0(info.total)} g por tanda`);render();
  }catch(e){toast('⚠ '+e.message)}
}

      :`<tr data-q="${q}"><td>${tagChips(f)}</td><td>${esc(f.marca)}</td><td class="l" style="white-space:normal;min-width:230px"><div class="cband" style="background:${esc(fHex(f)||'#3a3a44')}"><b>${esc(f.color)}</b><span>${fColName(f)}</span></div></td>
      <td class="l"><span class="meter ${k==='ok'?'':k}"><i style="width:${w}%"></i></span>${n0(f.gramos)} g <span class="hint">(${rl(num(f.gramos)/1000)})</span></td>
      <td>${num(f.comprados)}</td><td>${num(f.minimo)||'–'}</td><td>${num(f.precio)?eur(f.precio):'<span class="hint">sin precio</span>'}</td><td>${eur(num(f.gramos)/1000*num(f.precio))}</td><td>${chip(k,t)}</td>
      <td style="white-space:nowrap"><button class="ico" onclick="openFil('${f.id}')">Editar</button> <button class="ico" title="Añadir un rollo nuevo (+1000 g)" onclick="filPlus('${f.id}')">+1 rollo</button></td></tr>`});
  });
  return`<h2>Filamento</h2><p class="sub">El stock se guarda en <b>gramos</b>. Cada impresión registrada en Imprimir resta de aquí. Cuando compres filamento, pulsa "Registrar compra": suma los rollos al stock y guarda el historial. "+1 rollo" es el atajo para sumar uno solo (1.000 g). Todos tus rollos actuales se han convertido a 1.000 g cada uno; si alguno está empezado, ajústalo con Editar.</p>
  <div class="bar"><button class="btn blue" onclick="openCompra()">🛒 Registrar compra</button><button class="btn ghost" onclick="openFil('')">+ Nuevo filamento</button>
   <input type="search" placeholder="Buscar color, marca…" oninput="fSearch(this.value)" style="width:${mob?'100%':'200px'}">
   <select onchange="FMARCA=this.value;render()" style="width:${mob?'48%':'auto'}" aria-label="Marca"><option value="">Marca: todas</option>${marcaList().map(m=>`<option ${FMARCA===m?'selected':''}>${esc(m)}</option>`).join('')}<option value="__none" ${FMARCA==='__none'?'selected':''}>Sin marca</option></select>
   <select onchange="FTAG=this.value;render()" style="width:${mob?'48%':'auto'}" aria-label="Etiqueta"><option value="">Etiqueta: todas</option>${tagList().map(m=>`<option ${FTAG===m?'selected':''}>${esc(m)}</option>`).join('')}</select>
   ${(FMAT||FMARCA||FTAG||FALERT)?`<button class="btn ghost" onclick="fClear()">✕ Quitar filtros</button>`:''}
   <label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" ${FALERT?'checked':''} onchange="FALERT=this.checked;render()" style="width:auto;min-height:0"> Solo alertas</label>
   <span class="sp"></span>${['',...matList()].map(m=>`<button class="btn ${FMAT===m?'':'ghost'}" onclick="FMAT='${m}';render()">${m||'Todos'}</button>`).join('')}</div>
  ${mob?h+`<div class="lcard tot"><div class="lr"><b>TOTAL</b><b>${n0(g)} g · ${eur(valor)}</b></div></div>`
  :`<div class="tw"><table><tr><th>Etiquetas</th><th>Marca</th><th class="l">Color / referencia</th><th class="l">Restante</th><th>Total comprado</th><th>Mínimo</th><th>Precio rollo</th><th>Valor stock</th><th>Estado</th><th></th></tr>${h||'<tr><td colspan="10" class="hint">Sin resultados.</td></tr>'}
  <tr class="tot"><td colspan="3" class="l">TOTAL</td><td class="l">${n0(g)} g (${rl(g/1000)})</td><td colspan="3"></td><td>${eur(valor)}</td><td colspan="2"></td></tr></table></div>`}
  ${cpHist()}<p class="hint">Mostrando ${list.length} de ${S.filamentos.length} filamentos${(FMAT||FMARCA||FTAG||FALERT)?' (con filtros)':''}.</p><p class="hint">Barra: llena = tienes al menos el doble de tu mínimo (o 1 rollo, si no has puesto mínimo); a la mitad = estás justo en el mínimo. No depende de lo que hayas comprado en total.</p><p class="legend">Estados: ● OK · ▲ BAJO (en el mínimo o por debajo) · ✖ AGOTADO (0 g).</p>`;
}
function fSearch(v){v=v.toLowerCase();document.querySelectorAll('[data-q]').forEach(r=>{r.style.display=r.dataset.q.includes(v)?'':'none'})}

/* ---------- compras de filamento ---------- */
let CP=null;
const cpNewLine=()=>({fid:'',rollos:1,precio:'',material:FMAT||'PLA',marca:'',color:''});
function openCompra(){
  CP={fecha:today(),nota:'',lineas:[cpNewLine()]};
  modal('🛒 Registrar compra de filamento','<form id="mform" onsubmit="return false"><div id="cpbody"></div></form>',cpSave,{saveText:'Añadir al stock'});
  cpRender();
}
function cpOpts(sel){return`<option value="">Elige filamento…</option><option value="__new" ${sel==='__new'?'selected':''}>➕ Filamento nuevo…</option>`+matList().map(m=>{const it=S.filamentos.filter(f=>f.material===m);return it.length?`<optgroup label="${esc(m)}">`+it.map(f=>`<option value="${f.id}" ${f.id===sel?'selected':''}>${esc(f.color)}${f.marca?' · '+esc(f.marca):''}</option>`).join('')+'</optgroup>':''}).join('')}
function cpRender(){
  const el=document.getElementById('cpbody');if(!el)return;
  el.innerHTML=`<div class="fg"><label>Fecha<input type="date" value="${esc(CP.fecha)}" onchange="CP.fecha=this.value"></label>
   <label>Tienda / nota (opcional)<input value="${esc(CP.nota)}" placeholder="Ej. Bambu Store, Amazon…" onchange="CP.nota=this.value"></label></div>
   <h3 style="margin:14px 0 8px">Filamentos comprados</h3>`+CP.lineas.map((l,i)=>{
    const f=l.fid&&l.fid!=='__new'?fil(l.fid):null;
    return`<div class="cpl"><div class="lr"><b>Línea ${i+1}</b>${CP.lineas.length>1?`<button type="button" class="ico" onclick="cpDel(${i})">✕ Quitar</button>`:''}</div>
     <label>Filamento<select onchange="cpSel(${i},this.value)">${cpOpts(l.fid)}</select></label>
     ${l.fid==='__new'?`<div class="fg"><label>Material<select onchange="CP.lineas[${i}].material=this.value">${opts(matList(),l.material)}</select></label>
       <label>Marca<input value="${esc(l.marca)}" onchange="CP.lineas[${i}].marca=this.value" placeholder="Bambu Lab"></label>
       <label class="w2">Color / referencia<input value="${esc(l.color)}" onchange="CP.lineas[${i}].color=this.value" placeholder="Ej. ROJO 10200"></label></div>`:''}
     <div class="fg"><label>Rollos<input type="number" min="1" step="1" value="${esc(l.rollos)}" oninput="CP.lineas[${i}].rollos=this.value;cpTot()"></label>
      <label>Precio por rollo (€)<input type="number" min="0" step="0.01" value="${esc(l.precio)}" placeholder="${f&&num(f.precio)?num(f.precio):'0'}" oninput="CP.lineas[${i}].precio=this.value;cpTot()"></label></div>
     ${f?`<p class="hint">Ahora: ${n0(f.gramos)} g (${rl(num(f.gramos)/1000)}) → después: <b>${n0(num(f.gramos)+num(l.rollos)*1000)} g</b></p>`:''}</div>`}).join('')+
   `<button type="button" class="btn ghost" onclick="CP.lineas.push(cpNewLine());cpRender()">+ Añadir otra línea</button><p id="cptot" style="margin-top:12px"></p>
   <p class="hint">El precio por rollo que pongas pasa a ser el precio actual de ese filamento (si lo dejas vacío se mantiene el que tenía). Los rollos nuevos se suman al stock en gramos (1 rollo = 1.000 g).</p>`;
  cpTot();
}
function cpSel(i,v){CP.lineas[i].fid=v;const f=v&&v!=='__new'?fil(v):null;if(f&&!CP.lineas[i].precio&&num(f.precio))CP.lineas[i].precio=num(f.precio);cpRender()}
function cpDel(i){CP.lineas.splice(i,1);cpRender()}
function cpTot(){const e=document.getElementById('cptot');if(!e)return;let r=0,t=0;CP.lineas.forEach(l=>{const f=l.fid&&l.fid!=='__new'?fil(l.fid):null,n=num(l.rollos),p=l.precio!==''?num(l.precio):(f?num(f.precio):0);r+=n;t+=n*p});e.innerHTML=`Total: <b>${n0(r)} rollos · ${eur(t)}</b>`}
function cpSave(){
  const ls=[];
  for(const l of CP.lineas){
    const n=num(l.rollos);
    if(!l.fid){toast('Elige un filamento en cada línea (o quita la línea vacía)');return}
    if(!(n>0)){toast('Pon cuántos rollos has comprado');return}
    if(l.fid==='__new'&&!String(l.color).trim()){toast('Pon el color / referencia del filamento nuevo');return}
    ls.push(l)}
  if(!ls.length){toast('Añade al menos un filamento');return}
  const lineas=[];let total=0;
  ls.forEach(l=>{
    const n=num(l.rollos);let f,creado=false;
    if(l.fid==='__new'){f={id:uid('f'),material:l.material,etiquetas:[],marca:String(l.marca).trim(),color:String(l.color).trim(),hex:guessHex(l.color),comprados:0,gramos:0,minimo:0,precio:0};S.filamentos.push(f);creado=true}
    else f=fil(l.fid);
    const precioAnt=num(f.precio),precio=l.precio!==''?num(l.precio):precioAnt;
    f.gramos=num(f.gramos)+n*1000;f.comprados=num(f.comprados)+n;if(precio>0)f.precio=precio;
    total+=n*precio;lineas.push({fid:f.id,rollos:n,precio,precioAnt,creado});
  });
  S.compras.unshift({id:uid('c'),fecha:CP.fecha||today(),nota:String(CP.nota||'').trim(),lineas,total});
  closeModal();save();toast('Compra añadida al stock');render();
}
function cpUndo(id){
  const c=S.compras.find(x=>x.id===id);if(!c)return;
  ask('Deshacer compra',`<p>Se restarán del stock los rollos de esta compra (${c.lineas.map(l=>l.rollos+' × '+esc((fil(l.fid)||{color:'?'}).color)).join(', ')}).</p>`,()=>{
    c.lineas.forEach(l=>{const f=fil(l.fid);if(!f)return;f.gramos=Math.max(0,num(f.gramos)-l.rollos*1000);f.comprados=Math.max(0,num(f.comprados)-l.rollos);f.precio=l.precioAnt;
      if(l.creado&&f.gramos<=0&&f.comprados<=0&&!S.impresiones.some(im=>(im.consumo||[]).some(x=>x.fid===f.id)))S.filamentos=S.filamentos.filter(x=>x.id!==f.id)});
    S.compras=S.compras.filter(x=>x.id!==id);save();toast('Compra deshecha');render()},'Deshacer');
}
function cpHist(){
  if(!S.compras.length)return'';
  return`<h3 style="margin:18px 0 8px">Últimas compras</h3>`+S.compras.slice(0,8).map(c=>`<div class="lcard"><div class="lr"><b>${esc(fdate(c.fecha))}${c.nota?' · '+esc(c.nota):''}</b><b>${eur(c.total)}</b></div>
   <div class="hint">${c.lineas.map(l=>`${n0(l.rollos)} × ${esc((fil(l.fid)||{color:'(borrado)'}).color)}`).join(' · ')}</div>
   <div style="margin-top:6px"><button class="ico" onclick="cpUndo('${c.id}')">Deshacer</button></div></div>`).join('')}
function filPlus(id){const f=fil(id);f.gramos=num(f.gramos)+1000;f.comprados=num(f.comprados)+1;save();toast('+1 rollo: '+f.color);render()}
function openFil(id){
  FT=id?[...(fil(id).etiquetas||[])]:[];
  const f=id?fil(id):{material:FMAT||'PLA',etiquetas:[],marca:'',color:'',comprados:1,gramos:1000,minimo:0,precio:0};
  modal(id?'Editar filamento':'Nuevo filamento',`<form id="mform" onsubmit="return false"><div class="fg">
   <label>Material<select name="material">${opts(matList(),f.material)}</select></label>
   <div class="w2"><span class="lbl">Etiquetas (acabado, tipo…)</span><div id="tgbox"></div>
    <div style="display:flex;gap:6px;margin-top:6px"><input id="tgnew" placeholder="Nueva etiqueta…" onkeydown="if(event.key==='Enter'){event.preventDefault();fetAdd()}"><button type="button" class="btn ghost" onclick="fetAdd()">+ Crear</button></div></div>
   <label>Marca<input name="marca" list="marcas" value="${esc(f.marca)}"><datalist id="marcas">${[...new Set(S.filamentos.map(x=>x.marca).filter(Boolean))].map(m=>`<option value="${esc(m)}">`).join('')}</datalist></label>
   <label class="w2">Color / referencia<input name="color" value="${esc(f.color)}"></label>
   <div class="w2"><span class="lbl">Color visual</span><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><input type="color" name="hex" id="hexin" value="${esc(fHex(f)||'#888888')}" oninput="hexShow()" style="width:64px;height:44px;padding:2px"><b id="hexname"></b><button type="button" class="btn ghost" onclick="hexGuess()">Detectar por el nombre</button></div></div>
   <label>Comprados (rollos)<input type="number" name="comprados" step="1" value="${esc(f.comprados)}"></label>
   <label>Restante (gramos)<input type="number" name="gramos" step="any" value="${esc(f.gramos)}"></label>
   <label>Mínimo (rollos, 0 = sin aviso)<input type="number" name="minimo" step="any" value="${esc(f.minimo)}"></label>
   <label>Precio por rollo (€)<input type="number" name="precio" step="any" value="${esc(f.precio)}"></label></div></form>`,()=>{
    const n={hex:fv('hex'),material:fv('material'),etiquetas:[...FT],marca:fv('marca').trim(),color:fv('color').trim(),comprados:num(fv('comprados')),gramos:num(fv('gramos')),minimo:num(fv('minimo')),precio:num(fv('precio'))};
    if(!n.color){toast('Pon el color o referencia');return}
    if(id)Object.assign(f,n);else S.filamentos.push(Object.assign({id:uid('f')},n));
    save();closeModal();render();
  },{extra:id?`<button class="btn warn" onclick="delFil('${id}')">Borrar</button>`:''});
  fetDraw();hexShow();
}
function hexShow(){const i=document.getElementById('hexin'),b=document.getElementById('hexname');if(i&&b)b.innerHTML=`<i class="cdot big" style="background:${esc(i.value)}"></i> ≈ ${esc(hexName(i.value))}`}
function hexGuess(){const g=guessHex(fv('color'));if(!g){toast('No reconozco ese nombre: elige el color a mano');return}document.getElementById('hexin').value=g;hexShow()}
function fetDraw(){const b=document.getElementById('tgbox');if(!b)return;b.innerHTML=tagList().concat(FT.filter(t=>!tagList().includes(t))).map(t=>{const on=FT.includes(t);return`<button type="button" class="tgb ${on?'on':''}" onclick="fetTog(this.dataset.t)" data-t="${esc(t)}">${on?'✓ ':''}${esc(t)}</button>`}).join(' ')}
function fetTog(t){FT=FT.includes(t)?FT.filter(x=>x!==t):[...FT,t];fetDraw()}
function fetAdd(){const i=document.getElementById('tgnew'),t=i.value.trim();if(!t)return;const ex=tagList().find(x=>x.toLowerCase()===t.toLowerCase());const v=ex||t;if(!FT.includes(v))FT.push(v);i.value='';fetDraw()}
function delFil(id){const f=fil(id);ask('Borrar filamento',`<p>Se borrará <b>${esc(f.color)}</b>. Las recetas y el historial que lo usaban lo mostrarán como borrado.</p>`,()=>{S.filamentos=S.filamentos.filter(x=>x.id!==id);S.productos.forEach(p=>{if(p.ficha&&p.ficha.fils)p.ficha.fils=p.ficha.fils.filter(x=>x.fid!==id)});save();render()},'Borrar')}

/* ---------- GASTOS ---------- */
function vGastos(){
  const tot=S.gastos.reduce((a,g)=>a+gTotal(g),0),d=S.gastos.filter(g=>g.desc).reduce((a,g)=>a+gTotal(g),0);
  const head=`<h2>Gastos</h2><p class="sub">Apunta los gastos en positivo. Los marcados "Descuenta: Sí" restan del beneficio real (inversión de la web y la impresora). Los demás se muestran pero no restan, por ejemplo el filamento, que ya controlas en su stock.</p>
  <div class="bar"><button class="btn blue" onclick="openGasto('')">+ Nuevo gasto</button></div>`;
  if(isMob())return head+S.gastos.map(g=>`<div class="lcard"><div class="lr"><b>${esc(g.concepto)}</b>${g.desc?chip('info','DESCUENTA: SÍ'):chip('neu','DESCUENTA: NO')}</div><div class="hint">${esc(g.cat)} · ${n0(g.cant)} × ${eur(g.precio)}</div><div class="lr"><b>${eur(gTotal(g))}</b><button class="ico" onclick="openGasto('${g.id}')">Editar</button></div></div>`).join('')
    +`<div class="lcard tot"><div class="lr"><b>TOTAL</b><b>${eur(tot)}</b></div><div class="hint">Descuentan del beneficio: ${eur(d)}</div></div>`;
  return head+`<div class="tw"><table><tr><th class="l">Concepto</th><th>Categoría</th><th>Cantidad</th><th>Precio ud</th><th>Total</th><th>Descuenta del beneficio</th><th></th></tr>
  ${S.gastos.map(g=>`<tr><td class="l">${esc(g.concepto)}</td><td>${esc(g.cat)}</td><td>${n0(g.cant)}</td><td>${eur(g.precio)}</td><td>${eur(gTotal(g))}</td><td>${g.desc?chip('info','Sí'):chip('neu','No')}</td><td><button class="ico" onclick="openGasto('${g.id}')">Editar</button></td></tr>`).join('')||'<tr><td colspan="7" class="hint">Sin gastos.</td></tr>'}
  <tr class="tot"><td class="l">TOTAL</td><td></td><td></td><td></td><td>${eur(tot)}</td><td>Descuentan: ${eur(d)}</td><td></td></tr></table></div>`;
}
function openGasto(id){
  const g=id?S.gastos.find(x=>x.id===id):{concepto:'',cat:'Otros',cant:1,precio:0,desc:true};
  modal(id?'Editar gasto':'Nuevo gasto',`<form id="mform" onsubmit="return false"><div class="fg">
   <label class="w2">Concepto<input name="concepto" value="${esc(g.concepto)}"></label>
   <label>Categoría<select name="cat">${opts(CATS,g.cat)}</select></label>
   <label>Cantidad<input type="number" name="cant" step="any" value="${esc(g.cant)}"></label>
   <label>Precio ud (€)<input type="number" name="precio" step="any" value="${esc(g.precio)}"></label>
   <label style="display:flex;gap:8px;align-items:center;margin-top:20px"><input type="checkbox" name="desc" ${g.desc?'checked':''} style="width:auto;margin:0;min-height:0"> Descuenta del beneficio real</label></div></form>`,()=>{
    const n={concepto:fv('concepto').trim(),cat:fv('cat'),cant:num(fv('cant')),precio:Math.abs(num(fv('precio'))),desc:fv('desc')};
    if(!n.concepto){toast('Pon un concepto');return}
    if(id)Object.assign(g,n);else S.gastos.push(Object.assign({id:uid('g')},n));
    save();closeModal();render();
  },{extra:id?`<button class="btn warn" onclick="delGasto('${id}')">Borrar</button>`:''});
}
function delGasto(id){ask('Borrar gasto','<p>Se borrará el gasto.</p>',()=>{S.gastos=S.gastos.filter(g=>g.id!==id);save();render()},'Borrar')}

/* ---------- AJUSTES ---------- */
function vAjustes(){
  const a=AJ(),inp=(k,l,step,pre)=>`<label>${l}<input type="number" step="${step||'any'}" value="${esc(a[k])}" oninput="setAj('${k}',this.value)"></label>`;
  return`<h2>Ajustes</h2><p class="sub">Parámetros de los cálculos y copias de seguridad.</p>
  <section class="card"><h3>Parámetros de coste</h3><div class="fg">
   ${inp('elec','Electricidad (€ por hora)')}${inp('impresora','Precio de la impresora para desgaste (€)')}${inp('vida','Vida útil de la impresora (horas)')}
   <label>Merma de plástico (0,15 = 15 %)<input type="number" step="any" value="${esc(a.merma)}" oninput="setAj('merma',this.value)"></label>
   <label>Margen objetivo (0,6 = 60 %)<input type="number" step="any" value="${esc(a.margen)}" oninput="setAj('margen',this.value)"></label>
   ${inp('precioKg','Precio medio del filamento (€/kg), si un rollo no tiene precio')}
   <label>Contar regalados como coste extra<select onchange="setAj('regalados',this.value,true)">${opts(['Sí','No'],a.regalados)}</select></label>
   <label>Embalaje: coste de un envío en sobre (€)<input type="number" step="any" value="${esc(S.embalaje.sobre)}" oninput="S.embalaje.sobre=num(this.value);save()"></label>
   <label>Embalaje: coste de un envío en caja (€)<input type="number" step="any" value="${esc(S.embalaje.caja)}" oninput="S.embalaje.caja=num(this.value);save()"></label></div>
   <p class="hint">Regalados: con "Sí" su coste se resta otra vez (como hacía tu Excel); con "No" se evita el doble conteo, porque ya están dentro de los fabricados.</p></section>
  ${sySection()}
  <section class="card dark"><h3>Copia de seguridad</h3>
   <p class="sub">Todos los datos se guardan en este navegador (no en GitHub). Si borras los datos del navegador, se pierden. Exporta una copia de vez en cuando; también sirve para pasar los datos de un dispositivo a otro.</p>
   <div class="bar"><button class="btn blue" onclick="exportJSON()">⬇ Exportar copia (.json)</button><button class="btn ghost" onclick="$('#fjson').click()">⬆ Importar copia</button>
   <button class="btn warn" onclick="resetAll()">Volver a los datos iniciales del Excel</button></div>
   <p class="hint">Versión de la app: <b>v${APP_VERSION}</b> · ${esc(APP_NOTAS)}</p>
   <p class="hint">Última copia: ${S.meta.lastBackup?new Date(S.meta.lastBackup).toLocaleString('es-ES'):'nunca'}</p></section>`;
}
function setAj(k,v,txt){S.ajustes[k]=txt?v:num(v);save()}
function exportJSON(){
  S.meta.lastBackup=new Date().toISOString();save();
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));
  a.download='ept-gestion-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();toast('Copia exportada');render();
}
async function importJSON(file){
  if(!file)return;
  try{const d=JSON.parse(await file.text());if(!d.filamentos||!d.productos)throw new Error('no parece una copia de esta app');
    ask('Importar copia',`<p>Se reemplazarán <b>todos</b> los datos actuales por los de la copia (${d.productos.length} productos, ${d.filamentos.length} filamentos).</p>`,()=>{S=fix(d);save();toast('Copia importada');render()},'Importar');
  }catch(e){toast('⚠ Copia no válida: '+e.message)}
}
function resetAll(){ask('Volver a los datos iniciales','<p>Se borrarán todos los cambios (impresiones, pedidos, stock) y se cargarán de nuevo los datos que había en tu Excel. Exporta una copia antes si quieres conservarlos.</p>',()=>{S=fix(JSON.parse(JSON.stringify(SEED)));save();toast('Datos iniciales cargados');render()},'Restaurar')}

/* ---------- sincronización con Supabase (sin login, con clave de acceso) ---------- */
const APP_VERSION='1.02';
const APP_NOTAS='v1.02 · La barra de stock ya no depende del total comprado. v1.01 · Logo ELPUTORIDER, nuevo orden del menú, registrar compras de filamento, banda de color en la tabla. (v1.1: sincronización, etiquetas, color visual.)';
const SYNC_LS='ept_sync_v1';
let SY=(()=>{try{return JSON.parse(localStorage.getItem(SYNC_LS))||{}}catch(e){return{}}})();
let SYST=null,SYMSG='',SYBUSY=false,syTimer=null;
const syOn=()=>!!(SY.url&&SY.key&&SY.clave);
function sySave(){try{localStorage.setItem(SYNC_LS,JSON.stringify(SY))}catch(e){}}
const SYTXT={ok:['●','Sincronizado'],busy:['◆','Sincronizando…'],dirty:['▲','Pendiente de subir'],err:['✖','Sin conexión'],conf:['✖','Conflicto']};
function syStatus(st,msg){SYST=st;SYMSG=msg||'';syPaint()}
function syPaint(){
  const b=document.getElementById('sybadge');
  if(b){if(!syOn()){b.style.display='none'}else{const t=SYTXT[SYST]||['○','Nube'];b.style.display='';b.textContent=t[0]+' '+t[1]}}
  const e=document.getElementById('systate');
  if(e){const t=SYTXT[SYST]||['○','Sin sincronizar'];e.innerHTML=syOn()?`<b>${t[0]} ${t[1]}</b>${SYMSG?' · '+esc(SYMSG):''}${SY.rev?'<br><span class="hint">Última versión en la nube: '+new Date(SY.rev).toLocaleString('es-ES')+'</span>':''}`:'<b>○ No conectado</b>'}
}
async function syRpc(fn,body){
  const r=await fetch(SY.url.replace(/\/+$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:SY.key,Authorization:'Bearer '+SY.key},body:JSON.stringify(body)});
  if(!r.ok){const t=await r.text();throw new Error('HTTP '+r.status+(t?' · '+t.slice(0,140):''))}
  return r.json();
}
async function syPush(force){
  if(!syOn()||SYBUSY)return;
  SYBUSY=true;syStatus('busy');
  try{
    const r=await syRpc('ept_set',{p_clave:SY.clave,p_data:S,p_base:force?null:(SY.rev||null),p_force:!!force});
    if(r&&r.ok){SY.rev=r.updated_at;SY.dirty=false;sySave();syStatus('ok')}
    else if(r&&r.conflict){syStatus('conf','hay una versión más nueva en la nube');syConflict(r.updated_at)}
    else syStatus('err','respuesta inesperada');
  }catch(e){syStatus('err',e.message)}
  finally{SYBUSY=false}
}
async function syPull(manual){
  if(!syOn()||SYBUSY)return;
  if(MOD&&!manual)return;
  SYBUSY=true;syStatus('busy');
  try{
    const r=await syRpc('ept_get',{p_clave:SY.clave});
    SYBUSY=false;
    if(!r||!r.data){await syPush(true);if(manual)toast('Datos subidos a la nube');return}
    if(SY.rev===r.updated_at){if(SY.dirty)await syPush();else syStatus('ok');if(manual)toast('Ya estás al día');return}
    if(SY.dirty||!SY.rev){syStatus('conf','los datos de la nube y los de este dispositivo son distintos');syConflict(r.updated_at,r);return}
    syApply(r);if(manual)toast('Datos actualizados desde la nube');
  }catch(e){SYBUSY=false;syStatus('err',e.message)}
}
function syApply(r){S=fix(r.data);saveLocal();SY.rev=r.updated_at;SY.dirty=false;sySave();syStatus('ok');render()}
function syConflict(fecha,remote){
  const f=fecha?new Date(fecha).toLocaleString('es-ES'):'?';
  modal('Datos distintos en la nube',`<p>Los datos de este dispositivo y los de la nube (guardados el <b>${esc(f)}</b>) no coinciden. Elige cuáles quieres conservar; los otros se pierden.</p>
   <div class="bar"><button class="btn blue" onclick="syChoose('nube')">☁ Usar los de la nube</button><button class="btn ghost" onclick="syChoose('local')">📱 Usar los de este dispositivo</button></div>
   <p class="hint">Si tienes dudas, cancela, exporta una copia desde Ajustes y vuelve a sincronizar.</p>`,()=>closeModal(),{saveText:'Cancelar',cls:'ghost'});
}
async function syChoose(w){
  closeModal();
  if(w==='local'){await syPush(true);toast('Se han subido los datos de este dispositivo')}
  else{try{const r=await syRpc('ept_get',{p_clave:SY.clave});if(r&&r.data){syApply(r);toast('Datos cargados desde la nube')}}catch(e){syStatus('err',e.message)}}
}
function sySection(){
  return`<section class="card"><h3>Sincronización en la nube (Supabase)</h3>
   <p class="sub">Para ver los mismos datos desde cualquier navegador sin iniciar sesión. Se protege con una clave de acceso que escribes una vez en cada dispositivo.</p>
   <div class="fg">
    <label class="w2">URL del proyecto<input id="sy_url" placeholder="https://xxxx.supabase.co" value="${esc(SY.url||'')}" autocomplete="off"></label>
    <label class="w2">Clave pública (anon / publishable key)<input id="sy_key" placeholder="eyJ… o sb_publishable_…" value="${esc(SY.key||'')}" autocomplete="off"></label>
    <label class="w2">Clave de acceso (mínimo 12 caracteres)<input id="sy_clave" placeholder="la misma en todos tus dispositivos" value="${esc(SY.clave||'')}" autocomplete="off"></label></div>
   <div class="bar"><button class="btn blue" onclick="syConnect()">Conectar</button><button class="btn ghost" onclick="syGen()">Generar clave</button>
    <button class="btn ghost" onclick="syPull(true)">Sincronizar ahora</button><button class="btn warn" onclick="syOff()">Desconectar</button></div>
   <p id="systate"></p>
   <p class="hint">Guarda la clave de acceso en un sitio seguro: sin ella no se pueden recuperar los datos de la nube. La URL y las claves se guardan solo en este navegador, no van en las copias .json ni en GitHub.</p></section>`;
}
function syGen(){const a=new Uint8Array(18);crypto.getRandomValues(a);const c='abcdefghjkmnpqrstuvwxyz23456789';document.getElementById('sy_clave').value=[...a].map(x=>c[x%c.length]).join('').replace(/(.{6})(?=.)/g,'$1-')}
function syConnect(){
  const u=document.getElementById('sy_url').value.trim(),k=document.getElementById('sy_key').value.trim(),c=document.getElementById('sy_clave').value.trim();
  if(!/^https:\/\/[^ ]+$/.test(u)){toast('La URL debe empezar por https://');return}
  if(k.length<20){toast('Pega la clave pública del proyecto');return}
  if(c.length<12){toast('La clave de acceso necesita al menos 12 caracteres');return}
  SY={url:u,key:k,clave:c,rev:null,dirty:false};sySave();syPaint();syPull(true);
}
function syOff(){SY={};sySave();SYST=null;syPaint();toast('Desconectado. Los datos siguen en este navegador.');if(TAB==='ajustes')render()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&syOn()&&!SY.dirty)syPull()});
window.addEventListener('online',()=>{if(syOn())(SY.dirty?syPush():syPull())});

applyTheme();
render();
syPaint();document.getElementById('ver').textContent='v'+APP_VERSION;if(syOn())syPull();
</script>
</body>
</html>
